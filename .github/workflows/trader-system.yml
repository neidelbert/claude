# Trader-System: läuft auf GitHub-Servern (dort sind Yahoo, Nasdaq Trader, SEC und House Clerk erreichbar).
# Ergebnis: trader/UEBERSICHT.md + Push aufs iPhone (App „ntfy“). Steuerung: tools/trader/system.py
name: Trader-System

on:
  schedule:
    # Mo–Fr, alle Zeiten UTC. „auto“ entscheidet nach New Yorker Zeit, was fällig ist:
    # Morgen-Scan, ORB-Scan, Labor live, Preisalarme, Tagesbilanz, Labor-Rangliste oder nichts.
    - cron: "*/15 12 * * 1-5"
    # Handelszeit (beide Zeitzonen) + Tagesbilanz: alle 10 Minuten
    - cron: "*/10 13-21 * * 1-5"
    # nach Börsenschluss fürs Labor: 21:20/21:50/22:20/22:50 UTC (16:20–17:50 Uhr ET Winterzeit, 17:20–18:50 Sommerzeit)
    - cron: "20,50 21-22 * * 1-5"
  workflow_dispatch:
    inputs:
      teil:
        description: "Was soll laufen?"
        type: choice
        default: morning
        options: [morning, orb, live, lab, ticker, alerts, test, nachricht, seite, auto, schleife]
      ticker:
        description: "Nur bei „ticker“: Symbol, z. B. TSLA"
        required: false
        default: ""
      nachricht:
        description: "Nur bei „nachricht“: Text des Pushes"
        required: false
        default: ""
      alarme:
        description: "Nur bei „ticker“: Stopp/Ziel-Alarme aus dem Plan anlegen"
        type: boolean
        default: false
      leise:
        description: "Ohne Push (z. B. nachts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Zeitplan-Läufe und die Schleife nacheinander (nie zwei Schleifen gleichzeitig);
  # andere manuelle Läufe sofort (system.py führt gleichzeitige Commits zusammen)
  group: trader-${{ (github.event_name == 'schedule' || inputs.teil == 'schleife') && 'auto' || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_REPLY_TOPIC: ${{ secrets.NTFY_REPLY_TOPIC }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # Ja/Nein und Notizen verschlüsselt speichern (ohne Secret Klartext) und KI-Zweitmeinung (ohne Secret aus)
      DATEN_SCHLUESSEL: ${{ secrets.DATEN_SCHLUESSEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete (Verschlüsselung und KI)
        run: pip install -q cryptography anthropic
      - name: Kerzen-Cache fürs Labor laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/lab
          key: lab-bars-${{ github.run_id }}
          restore-keys: lab-bars-
      - name: Trader-System
        id: system
        env:
          TEIL: ${{ github.event_name == 'schedule' && 'schleife' || inputs.teil }}
          NTFY_DRY: ${{ inputs.leise && '1' || '' }}
          TICKER: ${{ inputs.ticker }}
          ALARME: ${{ inputs.alarme }}
          NACHRICHT: ${{ inputs.nachricht }}
          NACHRICHT_TITEL: "Auswertung von Claude"
          NACHRICHT_LINK: "https://github.com/neidelbert/claude/blob/main/docs/AUSWERTUNG.md"
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PUSH_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          set -euo pipefail
          args=("$TEIL")
          if [ "$TEIL" = "ticker" ]; then
            args+=("$TICKER")
            if [ "$ALARME" = "true" ]; then args+=("--alerts"); fi
          fi
          if [ "$TEIL" = "nachricht" ]; then args=("message"); fi
          if [ "$TEIL" = "seite" ]; then echo "Nur Webseite neu bauen."; exit 0; fi
          if [ "$TEIL" = "schleife" ]; then
            # GitHub startet Zeitpläne oft 30–45 Minuten zu spät. Darum arbeitet ein Lauf selbst im 10-Minuten-Takt,
            # solange heute etwas fällig ist (höchstens 5,5 Stunden; danach übernimmt der nächste Zeitplan-Lauf).
            ende=$(( $(date +%s) + 19800 ))
            while python3 tools/trader/system.py window; do
              out=$(mktemp)
              GITHUB_OUTPUT="$out" python3 tools/trader/system.py auto || echo "Durchgang mit Fehler, weiter"
              grep -q "lab_ran=true" "$out" && echo "lab_ran=true" >> "$GITHUB_OUTPUT"
              if grep -q "published=true" "$out"; then bash tools/trader/seite.sh || echo "Webseite nicht veröffentlicht"; fi
              [ "$(date +%s)" -ge "$ende" ] && break
              sleep $(( 600 - $(date +%s) % 600 + 20 ))
            done
            exit 0
          fi
          if [ "$TEIL" != "auto" ] && [ "$TEIL" != "ticker" ] && [ "$TEIL" != "test" ] && [ "$TEIL" != "nachricht" ]; then args+=("--force"); fi
          python3 tools/trader/system.py "${args[@]}"
      - name: Kerzen-Cache speichern (nur nach dem Labor)
        if: steps.system.outputs.lab_ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/lab
          key: lab-bars-${{ github.run_id }}
      - name: Webseite bauen und veröffentlichen (Branch gh-pages)
        if: steps.system.outputs.published == 'true' || inputs.teil == 'seite'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PUSH_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        run: |
          pip install -q cryptography
          bash tools/trader/seite.sh
      - name: Absturz melden
        if: failure()
        run: |
          TOPIC="${NTFY_TOPIC:-$(python3 -c 'import json;print(json.load(open("trader/system.json"))["ntfy_topic"])')}"
          curl -sS -H "Title: Trader-System: Lauf fehlgeschlagen" -H "Priority: 4" -H "Tags: warning" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Der Lauf ist abgestürzt oder ein Teil hat einen Fehler gemeldet. Tippen öffnet das Protokoll." \
            "https://ntfy.sh/$TOPIC" || true

