# Trader-System: läuft auf GitHub-Servern (dort sind Yahoo, Nasdaq Trader, SEC und House Clerk erreichbar).
# Ergebnis: trader/UEBERSICHT.md + Push aufs iPhone (App „ntfy“). Steuerung: tools/trader/system.py
name: Trader-System

on:
  schedule:
    # Mo–Fr, alle Zeiten UTC. „auto“ entscheidet nach New Yorker Zeit, was fällig ist:
    # Morgen-Scan, ORB-Scan, Labor live, Preisalarme, Tagesbilanz, Labor-Rangliste oder nichts.
    - cron: "*/15 12 * * 1-5"
    # Handelszeit (beide Zeitzonen) + Tagesbilanz: alle 10 Minuten
    - cron: "*/10 13-21 * * 1-5"
    # nach Börsenschluss fürs Labor: 21:20/21:50/22:20/22:50 UTC (16:20–17:50 Uhr ET Winterzeit, 17:20–18:50 Sommerzeit)
    - cron: "20,50 21-22 * * 1-5"
  workflow_dispatch:
    inputs:
      teil:
        description: "Was soll laufen?"
        type: choice
        default: morning
        options: [morning, orb, live, lab, ticker, alerts, test, nachricht, seite, auto]
      ticker:
        description: "Nur bei „ticker“: Symbol, z. B. TSLA"
        required: false
        default: ""
      nachricht:
        description: "Nur bei „nachricht“: Text des Pushes"
        required: false
        default: ""
      alarme:
        description: "Nur bei „ticker“: Stopp/Ziel-Alarme aus dem Plan anlegen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Zeitplan-Läufe nacheinander; manuelle Läufe sofort (system.py führt gleichzeitige Commits zusammen)
  group: trader-${{ github.event_name == 'schedule' && 'auto' || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      published: ${{ steps.system.outputs.published || (inputs.teil == 'seite' && 'true') || '' }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_REPLY_TOPIC: ${{ secrets.NTFY_REPLY_TOPIC }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kerzen-Cache fürs Labor laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/lab
          key: lab-bars-${{ github.run_id }}
          restore-keys: lab-bars-
      - name: Trader-System
        id: system
        env:
          TEIL: ${{ github.event_name == 'schedule' && 'auto' || inputs.teil }}
          TICKER: ${{ inputs.ticker }}
          ALARME: ${{ inputs.alarme }}
          NACHRICHT: ${{ inputs.nachricht }}
          NACHRICHT_TITEL: "Auswertung von Claude"
          NACHRICHT_LINK: "https://github.com/neidelbert/claude/blob/main/docs/AUSWERTUNG.md"
        run: |
          set -euo pipefail
          args=("$TEIL")
          if [ "$TEIL" = "ticker" ]; then
            args+=("$TICKER")
            if [ "$ALARME" = "true" ]; then args+=("--alerts"); fi
          fi
          if [ "$TEIL" = "nachricht" ]; then args=("message"); fi
          if [ "$TEIL" = "seite" ]; then echo "Nur Webseite neu bauen."; exit 0; fi
          if [ "$TEIL" != "auto" ] && [ "$TEIL" != "ticker" ] && [ "$TEIL" != "test" ] && [ "$TEIL" != "nachricht" ]; then args+=("--force"); fi
          python3 tools/trader/system.py "${args[@]}"
      - name: Kerzen-Cache speichern (nur nach dem Labor)
        if: steps.system.outputs.lab_ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/lab
          key: lab-bars-${{ github.run_id }}
      - name: Webseite bauen (verschlüsselt)
        if: steps.system.outputs.published == 'true' || inputs.teil == 'seite'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          pip install -q cryptography
          python3 tools/trader/site.py build
      - name: Webseite hochladen
        if: steps.system.outputs.published == 'true' || inputs.teil == 'seite'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Absturz melden
        if: failure()
        run: |
          TOPIC="${NTFY_TOPIC:-$(python3 -c 'import json;print(json.load(open("trader/system.json"))["ntfy_topic"])')}"
          curl -sS -H "Title: Trader-System: Lauf fehlgeschlagen" -H "Priority: 4" -H "Tags: warning" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Der Lauf ist abgestürzt oder ein Teil hat einen Fehler gemeldet. Tippen öffnet das Protokoll." \
            "https://ntfy.sh/$TOPIC" || true

  pages:
    # veröffentlicht die Webseite (GitHub Pages, Quelle „GitHub Actions“ muss in den Settings eingeschaltet sein)
    needs: run
    if: needs.run.outputs.published == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pages einschalten (klappt nur, wenn erlaubt; sonst in den Settings: Pages → Source „GitHub Actions“)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
